name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/setup-geode@v1
        with:
          sdk: v6.0.0-alpha.1
          bindings: 2.2091
          target: Android64

      - name: Build Android64
        run: geode build --platform android64 --release

      - uses: actions/upload-artifact@v4
        with:
          name: Android64
          path: build/*.geode
